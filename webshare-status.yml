name: Webshare status to Discord

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (use "*/30 * * * *" for a private repo)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test message instead of checking the feed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: webshare-status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check feed and post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          FEED_URL: ${{ vars.FEED_URL }}
        run: python webshare_status.py ${{ inputs.test && '--test' || '' }}

      - name: Save state
        if: ${{ !inputs.test }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen status items" && git push)
