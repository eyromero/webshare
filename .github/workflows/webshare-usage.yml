name: Webshare usage alerts

on:
  schedule:
    - cron: "15,45 * * * *"   # check every 30 minutes
    - cron: "0 1 * * 1"       # weekly summary, Mondays 9:00 AM Philippine time (01:00 UTC)
  workflow_dispatch:
    inputs:
      summary:
        description: "Post a usage summary now"
        type: boolean
        default: true

permissions:
  contents: write

# Same group as the status workflow, so the two never push to the repo at the same time.
concurrency:
  group: webshare-status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check usage and post alerts
        env:
          WEBSHARE_API_KEY: ${{ secrets.WEBSHARE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.USAGE_DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          BANDWIDTH_ALERTS: ${{ vars.BANDWIDTH_ALERTS }}
          RENEWAL_ALERT_DAYS: ${{ vars.RENEWAL_ALERT_DAYS }}
        run: python webshare_usage.py ${{ (github.event.schedule == '0 1 * * 1' || inputs.summary) && '--summary' || '' }}

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usage_state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update usage alert state"
          git pull --rebase
          git push
